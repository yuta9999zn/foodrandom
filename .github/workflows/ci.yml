name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Kiểm tra định dạng
        run: cargo fmt --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Kiểm thử
        run: cargo test --locked
      - name: Kiểm tra dữ liệu seed
        run: |
          python3 - <<'EOF'
          import json, glob, os
          slugs = set()
          for f in sorted(glob.glob('seed/foods/*.json')):
              for d in json.load(open(f, encoding='utf-8')):
                  assert d['slug'] not in slugs, d['slug']
                  slugs.add(d['slug'])
                  img = os.path.join('..', 'frontend', 'public', 'images', 'foods', d['image']['file'])
                  assert os.path.exists(img), img
          for lang in ('en', 'ja', 'ko', 'zh'):
              got = {d['slug'] for f in glob.glob(f'seed/i18n/{lang}/*.json') for d in json.load(open(f, encoding='utf-8'))}
              assert got == slugs, f'thiếu bản dịch {lang}: {sorted(slugs - got)[:5]}'
          got = {d['slug'] for f in glob.glob('seed/prices/*.json') for d in json.load(open(f, encoding='utf-8'))}
          assert got == slugs, 'thiếu giá theo thị trường'
          print(f'{len(slugs)} món, đủ ảnh, bản dịch và giá')
          EOF

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
