# Nginx đứng trước FoodRandom: cân bằng tải nhiều bản sao backend/frontend, cache, nén, giới hạn tần suất.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30s;
    keepalive_requests 1000;
    server_tokens      off;
    client_max_body_size 64k;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---- Giới hạn tần suất theo IP (chống spam/bot, bảo vệ backend) ----
    limit_req_zone  $binary_remote_addr zone=api:20m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- Cache tại Nginx cho các API công khai đọc nhiều (danh sách, chi tiết món) ----
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m max_size=1g inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=2g inactive=7d use_temp_path=off;

    # Docker DNS: "backend"/"frontend" phân giải ra mọi bản sao (docker compose --scale).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        least_conn;
        server backend:8180 resolve max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream frontend {
        zone frontend 64k;
        least_conn;
        server frontend:3100 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        server_name _;

        limit_conn perip 100;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        # Một bản sao lỗi/quá tải thì thử bản sao khác (chỉ với request an toàn để lặp lại).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Đăng nhập / OTP: giới hạn chặt hơn.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
        }

        # API công khai đọc nhiều: cache ngắn tại Nginx cho khách (không cookie phiên).
        location ~ ^/api/v1/(foods|meta)(/|$) {
            limit_req zone=api burst=60 nodelay;
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $cookie_fr_session;
            proxy_no_cache $cookie_fr_session;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://backend;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }

        location ~ ^/(docs|api-docs)(/|$) {
            proxy_pass http://backend;
        }

        # Tài sản tĩnh có băm của Next và ảnh món ăn: cache dài hạn.
        location /_next/static/ {
            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://frontend;
        }

        location ~ ^/(images|_next/image) {
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://frontend;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://frontend;
        }
    }
}
